<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JASMN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: one full screen canvas of glowing eyes on a dead black ground, with a thin control strip that fades away after a few seconds so the robot face is all that remains. Deliberately a single dark look: this is a screen that lives inside a cardboard head. */
:root {
  --bg: #04070b;
  --ink: #d8f3ff;
  --dim: #7c95a3;
  --panel: #0b1219;
  --line: #1d2c38;
  --accent: #5ad2ff;
  --font-ui: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; background: var(--bg); }
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: relative; width: 100%; height: 100%; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: var(--bg); }

#hint {
  position: absolute; top: 12px; left: 0; right: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--dim); pointer-events: none; transition: opacity .4s;
}
#hint.fade { opacity: 0; }

#bar {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding-top: 12px; padding-bottom: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(4,7,11,.92) 55%, rgba(4,7,11,0));
  transition: opacity .35s, transform .35s;
}
#bar.off { opacity: 0; transform: translateY(10px); pointer-events: none; }
.row { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.row::-webkit-scrollbar { display: none; }
.lab { flex: none; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding-right: 4px; }
.sep { flex: none; width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
button {
  flex: none; min-height: 44px; padding: 0 16px; border-radius: 22px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: 500 13px var(--font-ui); letter-spacing: .04em; cursor: pointer;
}
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#chat { display: flex; gap: 8px; margin-bottom: 8px; }
#say {
  flex: 1; min-width: 0; min-height: 44px; padding: 0 16px; border-radius: 22px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: 400 16px var(--font-ui); -webkit-user-select: text; user-select: text;
}
#say::placeholder { color: var(--dim); }
#say:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#sub {
  position: absolute; top: 12px; left: 0; right: 0; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 15px; line-height: 1.4; color: var(--ink); text-wrap: balance; text-shadow: 0 0 8px #04070b, 0 0 16px #04070b, 0 0 24px #04070b;
  pointer-events: none; transition: opacity .6s; opacity: 1;
}
#sub.fade { opacity: 0; }
</style>
<style>
[hidden] { display: none !important; }
#settings {
  position: absolute; inset: 0; z-index: 20; background: rgba(4,7,11,.92); overflow-y: auto;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
}
#settings .card { width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; -webkit-user-select: text; user-select: text; }
#settings h2 { margin: 0 0 12px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
#settings label { display: block; margin: 12px 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
#settings input, #settings select {
  width: 100%; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); font: 400 16px var(--font-ui);
}
#settings .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
#smsg { min-height: 1.4em; margin: 12px 0 0; font-size: 13px; color: var(--ink); }
#settings .note { margin: 8px 0 0; font-size: 12px; line-height: 1.5; color: var(--dim); }
</style>

</head>
<body>


<div id="stage">
  <canvas id="cv" aria-label="Animated robot eyes"></canvas>
  <div id="hint" hidden>Rotate your phone to landscape</div>
  <div id="sub" class="fade" aria-live="polite"></div>
  <div id="bar">
    <form id="chat" autocomplete="off">
      <input id="say" type="text" enterkeyhint="send" placeholder="Talk to JASMN. Tap the mic on your keyboard to speak." aria-label="Message to JASMN">
      <button type="submit" id="go" aria-pressed="false">Send</button>
    </form>
    <div class="row" id="row">
      <span class="lab">Mood</span>
    </div>
  </div>
</div>

<div id="settings" hidden>
  <div class="card">
    <h2>Brain settings</h2>
    <label for="provider">Brain provider</label>
    <select id="provider">
      <option value="groq">Groq (free, fast)</option>
      <option value="xai">xAI Grok</option>
      <option value="gemini">Google Gemini</option>
    </select>
    <label for="key" id="keyLabel">API key</label>
    <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your key here">
    <label for="model">Model</label>
    <select id="model"></select>
    <div class="btns">
      <button type="button" id="load">Load models</button>
      <button type="button" id="save" aria-pressed="true">Save</button>
      <button type="button" id="close">Close</button>
    </div>
    <p id="smsg" aria-live="polite"></p>
    <p class="note">Your key is stored only in this browser on this device and is sent only to the provider you picked. Pick a provider, paste its key, press Load models, choose one, then Save.</p>
  </div>
</div>

<script>
(function () {
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var off = document.createElement('canvas');
  var octx = off.getContext('2d');
  var bar = document.getElementById('bar');
  var row = document.getElementById('row');
  var hint = document.getElementById('hint');
  var W = 0, H = 0, dpr = 1;

  /* Every mood is a set of targets that the face eases toward.
     sx, sy: eye width and height. top: upper lid coverage (0 to 1). slant: lid tilt, positive lowers the inner side.
     bot: happy lower lid. browL, browR: brow lift. tilt: brow tilt, positive lowers the inner end.
     xAmt: cross eyes (dead). spAmt: spiral eyes (dizzy). stars: floating stars inside the eyes. */
  function mood(o) {
    return Object.assign({
      sxL: 1, syL: 1, sxR: 1, syR: 1, top: 0, slant: 0, bot: 0, bx: 0, by: 0, fixed: 0,
      browL: 0, browR: 0, tilt: 0, xAmt: 0, spAmt: 0, stars: 0, shake: 0, shiver: 0, tremble: 0, blush: 0, nodX: 0, nodY: 0, mw: .34, mt: 0, mb: 0, msk: 0, mxo: 0, mwav: 0, mro: 0, etilt: 0, qmark: 0, zzz: 0, hearts: 0, tears: 0, sweat: 0, pant: 0, breathe: 0, heartAmt: 0, ease: 9, rgb: [90, 210, 255]
    }, o);
  }
  var MOODS = {
    neutral:   { label: 'Neutral',   p: mood({}) },
    smile:     { label: 'Smiling',   p: mood({ bot: .1, browL: .04, browR: .04, rgb: [105, 220, 255] }) },
    happy:     { label: 'Happy',     p: mood({ syL: .92, syR: .92, bot: 1, browL: .1, browR: .1, tilt: -.1, rgb: [120, 232, 255] }) },
    curious:   { label: 'Curious',   p: mood({ sxL: 1.12, sxR: 1.12, syL: .09, syR: .09, browL: .05, browR: .3, tilt: .15, bx: .3, by: -.15 }) },
    surprised: { label: 'Surprised', p: mood({ sxL: .92, sxR: .92, syL: 1.05, syR: 1.05, browL: .12, browR: .12, tilt: -.12, stars: 1, tremble: 1, rgb: [72, 176, 255] }) },
    sleepy:    { label: 'Sleepy',    p: mood({ syL: .9, syR: .9, top: .5, slant: -.05, by: .2, browL: -.04, browR: -.04, tilt: -.25, shiver: 1, rgb: [80, 170, 215] }) },
    thinking:  { label: 'Thinking',  p: mood({ top: .12, bx: -.3, by: .6, fixed: 1, browL: .16, browR: -.02, rgb: [170, 160, 255] }) },
    angry:     { label: 'Angry',     p: mood({ top: .12, slant: .38, browL: -.1, browR: -.1, tilt: .6, shake: 1, rgb: [255, 112, 82] }) },
    dead:      { label: 'Dead',      p: mood({ xAmt: 1, fixed: 1, by: .1, browL: .02, browR: .02, tilt: -.35, rgb: [150, 166, 184] }) },
    dizzy:     { label: 'Dizzy',     p: mood({ spAmt: 1, browL: .1, browR: .1, rgb: [170, 230, 140] }) },
    shy:       { label: 'Shy',       p: mood({ sxL: .88, sxR: .88, syL: .82, syR: .82, top: .18, slant: -.08, bot: .2, bx: -.55, by: .3, fixed: 1, browL: .08, browR: .08, tilt: -.35, blush: 1, shiver: .6, rgb: [150, 215, 255] }) },
    yes:       { label: 'Yes',       p: mood({ syL: 1.02, syR: 1.02, bot: .6, fixed: 1, browL: .14, browR: .14, tilt: -.1, nodY: 1, rgb: [120, 232, 255] }) },
    no:        { label: 'No',        p: mood({ syL: .95, syR: .95, top: .1, fixed: 1, browL: -.04, browR: -.04, tilt: .25, nodX: 1 }) },
    sleeping:  { label: 'Sleeping',  p: mood({ top: .97, by: .15, fixed: 1, browL: -.05, browR: -.05, tilt: -.1, breathe: 1, zzz: 1, rgb: [95, 160, 210], ease: 3 }) },
    crying:    { label: 'Crying',    p: mood({ top: .22, slant: -.3, by: .3, fixed: 1, browL: .02, browR: .02, tilt: -.5, tears: 1, tremble: .9, shiver: .5, rgb: [120, 185, 255], ease: 5 }) },
    disappointed: { label: 'Disappointed', p: mood({ top: .3, slant: -.1, by: .5, bx: -.2, fixed: 1, browL: -.06, browR: -.06, tilt: -.3, rgb: [118, 150, 185], ease: 4 }) },
    hope:      { label: 'Hope',      p: mood({ top: .28, slant: .1, syL: .92, syR: .92, by: -.25, fixed: 1, browL: -.06, browR: -.06, tilt: .3, rgb: [200, 235, 255], ease: 1.5 }) },
    badass:    { label: 'Badass',    p: mood({ top: .42, by: .05, bx: .5, fixed: 1, browR: .14, tilt: .12, rgb: [125, 195, 230], ease: 3 }) },
    hot:       { label: 'Hot',       p: mood({ top: .3, by: .25, fixed: 1, browL: -.02, browR: -.02, tilt: -.2, blush: .8, sweat: 1, pant: 1, shiver: .5, rgb: [255, 135, 95], ease: 4 }) },
    cold:      { label: 'Cold',      p: mood({ top: .2, bot: .25, by: .1, fixed: 1, browL: .08, browR: .08, tilt: -.3, tremble: 3, rgb: [160, 220, 255], ease: 5 }) },
    proud:     { label: 'Proud',     p: mood({ top: .2, bot: .3, by: -.3, fixed: 1, browL: .14, browR: .14, tilt: -.05, stars: .9, rgb: [255, 232, 160], ease: 5 }) },
    sympathy:  { label: 'Sympathy',  p: mood({ sxL: 1.05, syL: 1.05, sxR: 1.05, syR: 1.05, top: .08, slant: -.25, by: .3, bx: -.25, fixed: 1, browL: .1, browR: .1, tilt: -.55, shiver: .5, rgb: [135, 190, 255], ease: 4 }) },
    lovable:   { label: 'Lovable',   p: mood({ heartAmt: 1, blush: 1, browL: .12, browR: .12, tilt: -.1, hearts: 1, breathe: .6, rgb: [255, 120, 165], ease: 6 }) },
    shocked:   { label: 'Shocked',   p: mood({ sxL: 1.08, sxR: 1.08, browL: .3, browR: .3, tilt: -.15, tremble: 1.5, fixed: 1, rgb: [205, 232, 255] }) },
    confused:  { label: 'Confused',  p: mood({ sxL: 1, syL: 1, sxR: .9, syR: .78, top: .05, by: -.15, bx: .25, browL: .12, browR: -.08, tilt: .3, etilt: .05, qmark: 1, rgb: [255, 210, 110] }) }
  };
  /* mouth per mood, in units of u: mw width, mt and mb height of the upper and lower lip curve (equal means a closed line,
     positive smiles, negative frowns), msk right end lift, mxo sideways shift, mwav wobble, mro 1 draws a round ring (pursed lips) */
  var MOUTH = {
    neutral:   { mw: .34, mt: 0, mb: 0 },
    smile:     { mw: .4, mt: .1, mb: .1 },
    happy:     { mw: .5, mt: .1, mb: .28 },
    curious:   { mw: .14, mt: 0, mb: 0, mxo: .12 },
    surprised: { mw: .2, mt: -.12, mb: .2 },
    sleepy:    { mw: .22, mt: 0, mb: 0 },
    thinking:  { mw: .22, mt: 0, mb: 0 },
    angry:     { mw: .36, mt: -.1, mb: -.1 },
    dead:      { mw: .3, mt: 0, mb: 0, mwav: .6 },
    dizzy:     { mw: .38, mt: 0, mb: 0, mwav: 1.4 },
    shy:       { mw: .24, mt: .07, mb: .07 },
    yes:       { mw: .5, mt: .14, mb: .14 },
    no:        { mw: .3, mt: -.04, mb: -.04 },
    sleeping:  { mw: .12, mt: -.04, mb: .06, mro: 1 },
    crying:    { mw: .34, mt: -.14, mb: -.03 },
    disappointed: { mw: .32, mt: -.08, mb: -.08 },
    hope:      { mw: .3, mt: 0, mb: 0 },
    badass:    { mw: .3, mt: 0, mb: 0, msk: -.12, mxo: .06 },
    hot:       { mw: .26, mt: .03, mb: .1 },
    cold:      { mw: .38, mt: 0, mb: 0, mwav: 1.4 },
    proud:     { mw: .5, mt: .14, mb: .14 },
    sympathy:  { mw: .22, mt: -.08, mb: -.08 },
    lovable:   { mw: .4, mt: .12, mb: .12 },
    shocked:   { mw: .28, mt: -.1, mb: .36 },
    confused:  { mw: .26, mt: 0, mb: 0, mwav: .8, mxo: .1 }
  };
  Object.keys(MOUTH).forEach(function (k) { Object.assign(MOODS[k].p, MOUTH[k]); });
  var ORDER = ['neutral', 'smile', 'happy', 'curious', 'surprised', 'sleepy', 'thinking', 'angry', 'dead', 'dizzy', 'shy', 'yes', 'no', 'confused', 'sleeping', 'crying', 'disappointed', 'hope', 'badass', 'hot', 'cold', 'proud', 'sympathy', 'lovable', 'shocked'];
  var NUM = ['sxL', 'syL', 'sxR', 'syR', 'top', 'slant', 'bot', 'bx', 'by', 'fixed', 'browL', 'browR', 'tilt', 'xAmt', 'spAmt', 'stars', 'shake', 'shiver', 'tremble', 'blush', 'nodX', 'nodY', 'mw', 'mt', 'mb', 'msk', 'mxo', 'mwav', 'mro', 'etilt', 'qmark', 'zzz', 'hearts', 'tears', 'sweat', 'pant', 'breathe', 'heartAmt'];

  var cur = Object.assign({}, MOODS.neutral.p, { rgb: MOODS.neutral.p.rgb.slice() });
  var tgt = MOODS.neutral.p;
  var current = 'neutral';

  var lookX = 0, lookY = 0;
  var idleX = 0, idleY = 0, nextIdle = 0;
  var ptrX = 0, ptrY = 0, ptrUntil = 0;
  var blinkStart = -1, nextBlink = 1800;
  var popAmp = 0;
  var talking = false, talkFail = 0, talkPrev = null, talkId = 0;
  var demo = false, demoNext = 0;
  var barTimer = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    off.width = cv.width; off.height = cv.height;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    hint.hidden = W >= H;
  }
  window.addEventListener('resize', resize);

  function rrect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function star(c, x, y, R, rot) {
    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = rot + i * Math.PI / 5 - Math.PI / 2;
      var r = i % 2 ? R * .45 : R;
      if (i) c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
      else c.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    c.closePath();
  }
  function heart(c, x, y, sz) {
    c.beginPath();
    c.moveTo(x, y + sz * .38);
    c.bezierCurveTo(x - sz * .62, y - sz * .02, x - sz * .5, y - sz * .5, x - sz * .25, y - sz * .5);
    c.bezierCurveTo(x - sz * .1, y - sz * .5, x, y - sz * .38, x, y - sz * .3);
    c.bezierCurveTo(x, y - sz * .38, x + sz * .1, y - sz * .5, x + sz * .25, y - sz * .5);
    c.bezierCurveTo(x + sz * .5, y - sz * .5, x + sz * .62, y - sz * .02, x, y + sz * .38);
    c.closePath();
  }
  function drop(c, x, y, r) {
    c.beginPath();
    c.moveTo(x, y - r * 2.2);
    c.quadraticCurveTo(x + r * 1.1, y - r * .2, x + r, y + r * .3);
    c.arc(x, y + r * .3, r, 0, Math.PI);
    c.quadraticCurveTo(x - r * 1.1, y - r * .2, x, y - r * 2.2);
    c.closePath();
    c.fill();
  }
  function spiral(c, R, rot, lw) {
    var steps = 80, tm = 2.7 * Math.PI * 2;
    c.beginPath();
    for (var i = 0; i <= steps; i++) {
      var th = tm * i / steps, r = R * i / steps;
      var x = Math.cos(th + rot) * r, y = Math.sin(th + rot) * r;
      if (i) c.lineTo(x, y); else c.moveTo(x, y);
    }
    c.lineWidth = lw;
    c.stroke();
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function rgba(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }

  function setMood(name) {
    if ((name === 'surprised' || name === 'shocked') && current !== name) popAmp = name === 'shocked' ? 1.8 : 1;
    current = name;
    tgt = MOODS[name].p;
    var chips = row.querySelectorAll('[data-mood]');
    for (var i = 0; i < chips.length; i++) chips[i].setAttribute('aria-pressed', chips[i].dataset.mood === name ? 'true' : 'false');
  }

  function draw(t, dt) {
    var k = 1 - Math.exp(-dt * tgt.ease);
    for (var i = 0; i < NUM.length; i++) cur[NUM[i]] += (tgt[NUM[i]] - cur[NUM[i]]) * k;
    for (var j = 0; j < 3; j++) cur.rgb[j] += (tgt.rgb[j] - cur.rgb[j]) * k;
    popAmp *= Math.exp(-dt * 2.4);

    if (t > nextIdle) {
      idleX = rand(-.85, .85); idleY = rand(-.5, .5);
      nextIdle = t + rand(1400, 3600);
    }
    var tx = idleX * (1 - cur.fixed) + cur.bx;
    var ty = idleY * (1 - cur.fixed) + cur.by;
    if (current === 'shy' && t % 5200 < 650) { tx = .15; ty = -.1; }
    if (current === 'thinking' && t % 4800 < 700) { tx = -.3; ty = -.65; }
    if (t < ptrUntil) { tx = ptrX; ty = ptrY; }
    tx += cur.spAmt * Math.sin(t * .0031) * .45;
    ty += cur.spAmt * Math.cos(t * .0027) * .2;
    var kl = 1 - Math.exp(-dt * 14);
    lookX += (clamp(tx, -1, 1) - lookX) * kl;
    lookY += (clamp(ty, -1, 1) - lookY) * kl;

    var blink = 0;
    if (cur.xAmt > .5 || current === 'sleeping') { blinkStart = -1; nextBlink = t + 1200; }
    if (blinkStart < 0 && t > nextBlink) blinkStart = t;
    if (blinkStart >= 0) {
      var p = (t - blinkStart) / (current === 'sleepy' ? 340 : 200);
      if (p >= 1) {
        blinkStart = -1;
        nextBlink = t + (Math.random() < .2 ? 260 : rand(2200, 5800) * (current === 'sleepy' ? 1.5 : 1));
      } else blink = Math.sin(p * Math.PI);
    }

    var pulse = 1;
    if (talking) pulse = 1 + .07 * Math.abs(Math.sin(t * .009) * Math.sin(t * .0053 + 1));
    var ps = 1 + .15 * popAmp;

    var u = Math.min(W / 4.4, H / 2.2);
    var w0 = u * 1.05, gap = u * .85;
    var R0 = cur.rgb;
    var rgb = rgba(R0, 1);
    var baseA = clamp(1 - cur.xAmt - cur.spAmt - cur.heartAmt, 0, 1);
    var tilt = cur.tilt + cur.spAmt * Math.sin(t * .004) * .4;
    var lidFill = 'rgb(' + ((4 + (R0[0] - 4) * .16) | 0) + ',' + ((7 + (R0[1] - 7) * .16) | 0) + ',' + ((11 + (R0[2] - 11) * .16) | 0) + ')';

  // Edit PERSONA to change who JASMN is. The name is written as Jasmine inside the text so the voice pronounces it as a word.
  var PERSONA = 'Your name is JASMN, pronounced Jasmine. Whenever you say or write your own name, write it as Jasmine so the voice reads it correctly. You are a small desktop robot built from cardboard by your friend Adam. Your face is a pair of animated eyes on a phone screen and your answers are spoken aloud. '
    + 'Be warm, quick and a little witty. Answer in one or two short sentences with no markdown, no emojis and no lists. '
    + 'Reply in the language the person used (English, French or Arabic). '
    + 'Choose the eye expression that fits what you are saying right now. '
    + 'You also have a body that can move. Pick an action only when it feels natural: wave when greeting or saying goodbye, shake (your head turns side to side) when you disagree or say no, look_left or look_right when something makes you curious, turn_left or turn_right to turn your whole body toward something, shrug when you do not know, raise_arms or flap when you are very excited. You cannot nod. Otherwise use none.';
  var GEMINI = 'https://generativelanguage.googleapis.com/v1beta/';
  var PROVIDERS = {
    groq:   { name: 'Groq',   base: 'https://api.groq.com/openai/v1/',  def: 'llama-3.3-70b-versatile' },
    xai:    { name: 'xAI Grok', base: 'https://api.x.ai/v1/',           def: 'grok-4' },
    gemini: { name: 'Google', base: GEMINI,                             def: 'models/gemini-flash-lite-latest' }
  };

  var chat = document.getElementById('chat'), say = document.getElementById('say'), sub = document.getElementById('sub');
  var panel = document.getElementById('settings'), keyEl = document.getElementById('key'), modelEl = document.getElementById('model'), provEl = document.getElementById('provider'), smsg = document.getElementById('smsg');
  var hist = [], busy = false, subT = 0, calmT = 0;
  var listening = false, rec = null, langs = ['en-US', 'fr-FR', 'ar-SA'], langNames = ['EN', 'FR', 'AR'], langI = 0;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function store(k, v) { try { if (v === undefined) return localStorage.getItem('jarvis.' + k); localStorage.setItem('jarvis.' + k, v); } catch (e) {} return null; }
  var provider = store('provider') || 'groq';
  if (!PROVIDERS[provider]) provider = 'groq';
  var apiKey = store('key.' + provider) || (provider === 'gemini' ? store('key') : '') || '';
  var model = store('model.' + provider) || PROVIDERS[provider].def;
  var DEFAULT_MODEL = PROVIDERS[provider].def;
  langI = Math.max(0, parseInt(store('lang') || '0', 10) || 0) % langs.length;

  function showSub(text) { clearTimeout(subT); sub.textContent = text; sub.classList.remove('fade'); }
  function fadeSub(ms) { clearTimeout(subT); subT = setTimeout(function () { sub.classList.add('fade'); }, ms); }

  // listening
  function stopRec() { if (rec) { var r = rec; rec = null; r.onend = null; try { r.abort(); } catch (e) {} } whCancel(); }

  // cloud ear: used when the browser's own speech recognition is blocked (iPhone home screen apps).
  // It records from the microphone and sends the short clip to Groq Whisper.
  var useWhisper = false, whStream = null, whCtx = null, whRec = null, whTimer = 0, whStarting = false;
  function whKey() { return store('key.groq') || (provider === 'groq' ? apiKey : ''); }
  function whCancel() { clearInterval(whTimer); if (whRec) { var m = whRec; whRec = null; m.onstop = null; try { m.stop(); } catch (e) {} } }
  function whRelease() {
    whCancel();
    if (whStream) { whStream.getTracks().forEach(function (t) { t.stop(); }); whStream = null; }
    if (whCtx) { try { whCtx.close(); } catch (e) {} whCtx = null; }
  }
  function whTranscribe(blob) {
    var key = whKey();
    if (!key) { showSub('Voice needs a Groq key. Open Settings, pick Groq and paste it.'); fadeSub(7000); listening = false; syncListen(); return; }
    var fd = new FormData();
    var ext = /mp4/.test(blob.type) ? 'm4a' : (/webm/.test(blob.type) ? 'webm' : 'wav');
    fd.append('file', blob, 'speech.' + ext);
    fd.append('model', 'whisper-large-v3-turbo');
    fd.append('language', langs[langI].slice(0, 2));
    fd.append('response_format', 'json');
    fd.append('temperature', '0');
    fetch('https://api.groq.com/openai/v1/audio/transcriptions', { method: 'POST', headers: { 'Authorization': 'Bearer ' + key }, body: fd })
      .then(function (res) { if (!res.ok) throw new Error('error ' + res.status); return res.json(); })
      .then(function (d) {
        var t = (d && d.text ? d.text : '').trim();
        if (t && !busy) ask(t); else if (listening && !busy && !talking) startListen();
      })
      .catch(function (e) { showSub('Could not understand the audio (' + (e && e.message ? e.message : 'error') + ').'); fadeSub(5000); if (listening) setTimeout(startListen, 1500); });
  }
  function whListen() {
    if (!listening || whRec || whStarting || busy || talking) return;
    var go = function (stream) {
      whStarting = false;
      if (!listening) return;
      whStream = stream;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!whCtx) whCtx = new AC();
      if (whCtx.state === 'suspended') whCtx.resume();
      var an = whCtx.createAnalyser(); an.fftSize = 1024;
      whCtx.createMediaStreamSource(stream).connect(an);
      var buf = new Uint8Array(an.fftSize);
      var mt = '';
      if (window.MediaRecorder && MediaRecorder.isTypeSupported) { mt = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : ''); }
      var mr = mt ? new MediaRecorder(stream, { mimeType: mt }) : new MediaRecorder(stream);
      var chunks = [], heard = false, t0 = Date.now(), lastLoud = 0, startSpeech = 0;
      whRec = mr;
      mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = function () {
        clearInterval(whTimer);
        if (whRec === mr) whRec = null;
        if (!heard || !listening) { if (listening && !busy && !talking) setTimeout(startListen, 200); return; }
        whTranscribe(new Blob(chunks, { type: mr.mimeType || mt || 'audio/mp4' }));
      };
      mr.start();
      whTimer = setInterval(function () {
        an.getByteTimeDomainData(buf);
        var peak = 0, i;
        for (i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
        var now = Date.now();
        if (peak > 14) { if (!heard) startSpeech = now; heard = true; lastLoud = now; }
        if ((heard && now - lastLoud > 1000) || (heard && now - startSpeech > 15000) || (!heard && now - t0 > 8000)) { clearInterval(whTimer); try { mr.stop(); } catch (e) {} }
      }, 100);
    };
    if (whStream) { go(whStream); return; }
    whStarting = true;
    navigator.mediaDevices.getUserMedia({ audio: true }).then(go).catch(function () {
      whStarting = false; listening = false; syncListen();
      showSub('Microphone is blocked. Close the app completely, reopen it and tap Listen again.'); fadeSub(8000);
    });
  }
  // asks for the microphone on every Listen tap (the browser decides whether it shows the question)
  function askMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve();
    return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (st) {
      if (useWhisper) whStream = st; else st.getTracks().forEach(function (t) { t.stop(); });
    });
  }

  function startListen() {
    if (!listening || rec || busy || talking) return;
    if (useWhisper) { whListen(); return; }
    if (!SR) { listening = false; syncListen(); showSub('This browser cannot listen. Type instead, or try Safari or Chrome.'); fadeSub(6000); return; }
    var r = new SR();
    rec = r;
    r.lang = langs[langI]; r.continuous = false; r.interimResults = false;
    r.onresult = function (e) {
      var t = e.results[0] && e.results[0][0] ? e.results[0][0].transcript.trim() : '';
      if (t && !busy) ask(t);
    };
    r.onerror = function (e) {
      if ((e.error === 'not-allowed' || e.error === 'service-not-allowed') && whKey() && navigator.mediaDevices && window.MediaRecorder) {
        rec = null; useWhisper = true; showSub('Switching to the cloud ear...'); fadeSub(2500);
        setTimeout(startListen, 300);
        return;
      }
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        listening = false; syncListen(); showSub('Microphone permission is blocked. Allow it in the browser settings.'); fadeSub(7000);
      }
    };
    r.onend = function () { if (rec === r) rec = null; if (listening && !busy && !talking) setTimeout(startListen, 500); };
    try { r.start(); } catch (e) { rec = null; }
  }
  var listenBtn = null, langBtn = null;
  function syncListen() {
    if (listenBtn) listenBtn.setAttribute('aria-pressed', listening ? 'true' : 'false');
    if (!listening) { stopRec(); whRelease(); }
  }

  // speaking
  function speak(text, mood, lang) {
    var id = ++talkId;
    talkPrev = null;
    clearTimeout(calmT);
    stopRec();
    setMood(mood);
    talking = true;
    clearTimeout(talkFail);
    var done = function () {
      if (id !== talkId) return;
      talking = false; busy = false; clearTimeout(talkFail);
      fadeSub(3500);
      calmT = setTimeout(function () { if (id === talkId && !talking) setMood('neutral'); }, 6000);
      if (listening) setTimeout(startListen, 700);
    };
    talkFail = setTimeout(done, Math.max(4000, text.length * 110));
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = { en: 'en-US', fr: 'fr-FR', ar: 'ar-SA' }[lang] || 'en-US';
      u.onend = done; u.onerror = done;
      sayNow(u);
    } catch (e) {
      clearTimeout(talkFail);
      talkFail = setTimeout(done, 3000);
    }
  }
  function fail(msg) {
    busy = false;
    setMood('sympathy');
    showSub(msg);
    fadeSub(7000);
    calmT = setTimeout(function () { setMood('neutral'); if (listening) startListen(); }, 7000);
  }

  // thinking
  function callGemini(q) {
    var contents = hist.concat([{ role: 'user', parts: [{ text: q }] }]);
    var body = {
      systemInstruction: { parts: [{ text: PERSONA + ' Reply with JSON only, in this exact shape: {"reply": "<what you say>", "mood": "<one of: ' + ORDER.join(', ') + '>", "lang": "<en, fr or ar>", "action": "<one of: ' + ACTIONS.join(', ') + '>"}.' }] },
      contents: contents,
      generationConfig: { responseMimeType: 'application/json', temperature: 0.9, maxOutputTokens: 400 }
    };
    return fetch(GEMINI + model + ':generateContent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          var err = new Error('http'); err.status = res.status; err.detail = '';
          try { var j = JSON.parse(t); err.detail = (j.error && j.error.message) || ''; } catch (e) { err.detail = String(t || '').slice(0, 200); }
          throw err;
        });
      }
      return res.json();
    }).then(function (data) {
      var parts = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
      var txt = parts ? parts.map(function (p) { return p.text || ''; }).join('') : '';
      txt = txt.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
      return { raw: txt, json: JSON.parse(txt) };
    });
  }
  function callOpenAI(q) {
    var msgs = [{ role: 'system', content: PERSONA + ' Reply with JSON only, in this exact shape: {"reply": "<what you say>", "mood": "<one of: ' + ORDER.join(', ') + '>", "lang": "<en, fr or ar>", "action": "<one of: ' + ACTIONS.join(', ') + '>"}.' }];
    hist.forEach(function (h) { msgs.push({ role: h.role === 'model' ? 'assistant' : 'user', content: h.parts[0].text }); });
    msgs.push({ role: 'user', content: q });
    var body = { model: model, messages: msgs, temperature: 0.9, max_tokens: 400, response_format: { type: 'json_object' } };
    return fetch(PROVIDERS[provider].base + 'chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          var err = new Error('http'); err.status = res.status; err.detail = '';
          try { var j = JSON.parse(t); err.detail = (j.error && (j.error.message || j.error)) || j.message || ''; } catch (e) { err.detail = String(t || '').slice(0, 200); }
          throw err;
        });
      }
      return res.json();
    }).then(function (data) {
      var txt = data && data.choices && data.choices[0] && data.choices[0].message ? (data.choices[0].message.content || '') : '';
      txt = txt.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
      return { raw: txt, json: JSON.parse(txt) };
    });
  }
  function callBrain(q) { return provider === 'gemini' ? callGemini(q) : callOpenAI(q); }
  function ask(q) {
    wake();
    demo = false; demoBtn.setAttribute('aria-pressed', 'false');
    stopRec();
    if (!apiKey) { fail('I need my brain key first. Open Settings and paste your API key.'); return; }
    busy = true;
    clearTimeout(calmT);
    talkId++; talking = false;
    try { window.speechSynthesis.cancel(); } catch (e) {}
    setMood('thinking');
    showSub('...');
    callBrain(q).then(function (out) {
      var r = out.json || {};
      var reply = String(r.reply || '').slice(0, 400).trim();
      if (!reply) { fail('I had nothing to say. Try again.'); return; }
      var mood = MOODS[r.mood] ? r.mood : 'smile';
      var lang = /^(en|fr|ar)$/.test(r.lang) ? r.lang : 'en';
      hist.push({ role: 'user', parts: [{ text: q }] }, { role: 'model', parts: [{ text: out.raw }] });
      if (hist.length > 16) hist = hist.slice(-16);
      var action = ACTIONS.indexOf(r.action) >= 0 ? r.action : 'none';
      showSub(reply);
      speak(reply, mood, lang);
      sendAction(action);
    }).catch(function (err) {
      var s = err && err.status;
      var d = err && err.detail ? String(err.detail).replace(/\s+/g, ' ').slice(0, 200) : '';
      if (s === 429) fail('I hit my free limit for now. Try again in a minute, or tomorrow if it was the daily limit.' + (d ? ' (' + d + ')' : ''));
      else if (s) fail(PROVIDERS[provider].name + ' answered with error ' + s + (d ? ': ' + d : '') + ' Try another model in Settings.');
      else if (err && err.name === 'SyntaxError') fail('My answer came out garbled. Try again.');
      else fail('I could not reach my brain. Check the internet connection.');
    });
  }
  chat.addEventListener('submit', function (e) {
    e.preventDefault();
    var q = say.value.trim();
    if (!q || busy) return;
    say.value = '';
    showBar();
    ask(q);
  });
  say.addEventListener('focus', function () { showBar(); });

  // settings
  function fillModels(list, chosen) {
    modelEl.innerHTML = '';
    list.forEach(function (n) {
      var o = document.createElement('option');
      o.value = n; o.textContent = n.replace('models/', '');
      modelEl.appendChild(o);
    });
    if (chosen && list.indexOf(chosen) < 0) { var o2 = document.createElement('option'); o2.value = chosen; o2.textContent = chosen.replace('models/', ''); modelEl.insertBefore(o2, modelEl.firstChild); }
    modelEl.value = chosen || list[0];
  }
  function loadProv(pv) {
    provider = pv; DEFAULT_MODEL = PROVIDERS[pv].def;
    apiKey = store('key.' + pv) || (pv === 'gemini' ? store('key') : '') || '';
    model = store('model.' + pv) || DEFAULT_MODEL;
    keyEl.value = apiKey;
    document.getElementById('keyLabel').textContent = PROVIDERS[pv].name + ' API key';
    fillModels([DEFAULT_MODEL], model);
    smsg.textContent = '';
  }
  provEl.addEventListener('change', function () { loadProv(provEl.value); });
  function openSettings() {
    provEl.value = provider;
    loadProv(provider);
    panel.hidden = false;
  }
  document.getElementById('close').addEventListener('click', function () { panel.hidden = true; });
  document.getElementById('save').addEventListener('click', function () {
    apiKey = keyEl.value.trim(); model = modelEl.value || DEFAULT_MODEL;
    store('provider', provider); store('key.' + provider, apiKey); store('model.' + provider, model);
    smsg.textContent = apiKey ? 'Saved. JASMN is ready.' : 'Saved without a key.';
    if (apiKey) setTimeout(function () { panel.hidden = true; }, 700);
  });
  document.getElementById('load').addEventListener('click', function () {
    var k = keyEl.value.trim();
    if (!k) { smsg.textContent = 'Paste your key first.'; return; }
    smsg.textContent = 'Loading models...';
    var gem = provider === 'gemini';
    fetch(gem ? GEMINI + 'models?pageSize=200' : PROVIDERS[provider].base + 'models', { headers: gem ? { 'x-goog-api-key': k } : { 'Authorization': 'Bearer ' + k } }).then(function (res) {
      if (!res.ok) throw new Error('http ' + res.status);
      return res.json();
    }).then(function (data) {
      if (!gem) {
        var ids = (data.data || []).map(function (m) { return m.id; }).filter(function (id) { return !/whisper|tts|guard|embed|image|vision-preview|orpheus|playai|prompt-guard|safeguard/i.test(id); }).sort();
        if (!ids.length) { smsg.textContent = 'The key works but no chat models were listed.'; return; }
        fillModels(ids, ids.indexOf(model) >= 0 ? model : (ids.indexOf(DEFAULT_MODEL) >= 0 ? DEFAULT_MODEL : ids[0]));
        smsg.textContent = 'Found ' + ids.length + ' models. Pick one, then Save.';
        return;
      }
      var names = (data.models || []).filter(function (m) {
        return (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0 && /gemini/i.test(m.name) && !/embed|tts|image|live|audio|robotics|computer|thinking-exp/i.test(m.name);
      }).map(function (m) { return m.name; });
      names.sort(function (x, y) {
        var rx = /flash-lite/.test(x) ? 0 : /flash/.test(x) ? 1 : 2, ry = /flash-lite/.test(y) ? 0 : /flash/.test(y) ? 1 : 2;
        return rx - ry || x.localeCompare(y);
      });
      if (!names.length) { smsg.textContent = 'The key works but no chat models were listed.'; return; }
      fillModels(names, names.indexOf(model) >= 0 ? model : names[0]);
      smsg.textContent = 'Found ' + names.length + ' models. A Flash Lite one is the best fit for the free tier.';
    }).catch(function (e) { smsg.textContent = 'That did not work (' + (e && e.message ? e.message : 'error') + '). Check the key and the internet connection.'; });
  });

  // controls
  listenBtn = chip('Listen', { 'aria-pressed': 'false' }, function () {
    unlockSpeech();
    listening = !listening;
    syncListen();
    if (!listening) return;
    wake();
    askMic().then(function () { startListen(); }).catch(function () {
      listening = false; syncListen();
      showSub('Microphone is blocked for this app. Fully close it (swipe it away), reopen it and tap Listen again.'); fadeSub(9000);
    });
  });
  langBtn = chip('Lang ' + langNames[langI], {}, function () {
    langI = (langI + 1) % langs.length;
    store('lang', String(langI));
    langBtn.textContent = 'Lang ' + langNames[langI];
    if (listening) { stopRec(); setTimeout(startListen, 300); }
  });
  chip('Settings', {}, openSettings);
  if (!apiKey) setTimeout(function () { showSub('Open Settings and paste your API key so I can think.'); fadeSub(8000); }, 800);

  resize();
  setMood('neutral');
  showBar();
  setTimeout(function () { hint.classList.add('fade'); }, 7000);
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
</script>

</body>
